<!-- LOCALIZERS: Each localizable piece of the page is marked with a comment -->
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="data:,">
	<!-- LOCALIZERS: You might want to change the font family. You can also add styles to override sizes, etc. -->
	<style>
	body {
		background: rgb(246, 246, 246);
		cursor: default;
		display: -webkit-box;
		font-family: '-apple-system-font';
		text-align: left;
		-webkit-box-align: center;
		-webkit-box-pack: center;
		-webkit-user-select: none;
		--button-accent-color: #FF5732;
		--inset-shadow-opacity: 0.085;
		--main-title-color: #444444;
		--second-button-border: rgba(0, 0, 0, 0.15);
		--second-button-text: #434343;
		--second-button-active: rgba(0, 0, 0, 0.03);
		--orion-logo-opacity: 1;
	}
	
	p {
		margin: 0;
		padding: 0;
	}
		
	a {
		color: #747474;
	}
	
	.content-container {
		min-width: 120px;
		max-width: 480px;
		margin: 0 auto;
		position: relative;
		width: 80%;
	}
	
	.main-title {
		font-size: 30px;
		font-weight: 600;
		color: var(--main-title-color);
		line-height: 34px;
		margin: 0 auto;
	}
	
	.main-title:before {
		content: '';
		position: absolute;
		width: 28px;
		height: 28px;
		background-repeat: no-repeat;
		background-position: 0 0;
		left: -38px;
		top: 4px;
		background-image: url("data:image/svg+xml,%3Csvg width='22' height='26' viewBox='0 0 22 26' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M6 6C6 2.68652 8.68652 0 12 0C15.3135 0 18 2.68652 18 6V9C19.1045 9 20 9.89551 20 11V21C20 21.0557 19.998 21.1104 19.9932 21.165L6 7.17188V6ZM4.00684 10.835L16.1719 23H6C5.42676 23 4.90918 22.7588 4.54492 22.3721C4.20703 22.0137 4 21.5312 4 21V11C4 10.9443 4.00195 10.8896 4.00684 10.835ZM12 2C9.79102 2 8 3.79102 8 6V9H16V6C16 3.79102 14.209 2 12 2ZM1.53033 4.46967C1.23744 4.17678 0.762563 4.17678 0.46967 4.46967C0.176777 4.76256 0.176777 5.23744 0.46967 5.53033L20.4697 25.5303C20.7626 25.8232 21.2374 25.8232 21.5303 25.5303C21.8232 25.2374 21.8232 24.7626 21.5303 24.4697L1.53033 4.46967Z' fill='%23FF5732'/%3E%3C/svg%3E%0A");
	}
	
	.error-message {
		font-size: 15px;
		color: #747474;
		line-height: 1.2;
		margin: 8px 0 25px 0;
	}
	
	.text-container {
		color: #444;
		position: relative;
		width: 100%;
		word-wrap: break-word;
	}
	
	._hidden {
		display: none;
	}
	
	a.second-button, a.accent-button {
		text-decoration: none;
		display: inline-flex;
		align-items: center;
		padding: 6px 18px;
		border-radius: 6px;
		gap: 5px;
		font-size: 13px;
		cursor: default;
	}
		
	.accent-button {
		background: var(--button-accent-color) -webkit-gradient(linear, left top, left bottom, from(rgba(255, 255, 255, 0.2)), to(rgba(0, 0, 0, 0.08)));
		box-shadow: inset 0 0 0 1px rgba(0, 0, 0, var(--inset-shadow-opacity)), 0 1px 2px 0 rgba(0, 0, 0, 0.08);
		color: #fff;
	}
	
	.accent-button:active {
		background: var(--button-accent-color) -webkit-gradient(linear, left top, left bottom, from(rgba(255, 255, 255, 0.12)), to(rgba(0, 0, 0, 0.08)));
	}
		
	.second-button {
		background: linear-gradient(180deg, #FFFFFF 0%, #FFFFFF 100%);
		box-shadow: 0px 0px 0px 1px rgba(0, 0, 0, 0.07), 0px 1px 1px rgba(0, 0, 0, 0.15);
		xbox-shadow: inset 0 0 0 1px var(--second-button-border);
		color: var(--second-button-text);
	}
	
	.second-button:active {
		background: var(--second-button-active);
	}
	
	.small-container {
		display: flex;
		align-items: center;
		justify-content: flex-start;
		gap: 10px;
	}
	
	@supports (-webkit-touch-callout: none) {
		a.mac {
			padding: 8px 20px;
		}
		.error-message {
			font-size: 15px;
			line-height: 1.4;
		}
		.main-title:before {
			left: 0;
			top: -50px;
		}
		.main-title {
			font-size: 22px;
			line-height: 1.1;
		}
	}
	
	@media (max-width: 400px) {
		.main-title:before {
			left: 0px;
			top: -50px;
		}
	}
	
	@media (prefers-color-scheme: dark) {
		body {
			background: rgb(28, 28, 30);
			--inset-shadow-opacity: 0;
			--main-title-color: #E6E6E6;
			--second-button-border: rgba(255, 255, 255, 0.15);
			--second-button-text: #8C8C8C;
			--second-button-active: rgba(255, 255, 255, 0.15);
		}
		.text-container {
			color: rgb(133, 133, 133);
		}
		.second-button {
			color: #fff;
			background: linear-gradient(180deg, #626262 0%, #454545 100%);
			box-shadow: 0px 0px 0px 1px rgba(0, 0, 0, 0.08), 0px 1px 1px rgba(0, 0, 0, 0.25);
		}
	}
	</style>
    
	<!-- LOCALIZERS: The next line contains the page title that appears in the window's title bar -->
	<title>{{TitleText}}</title>
</head>

<body class="{{PLATFORM}}">
	<div class="content-container">
		<div class="error-container">
			<div class="text-container">
				<!-- Main title -->
				<p class="main-title">{{TitleText}}</p>
			</div>
			<div class="text-container">
				<!-- Error detail message -->
				<p class="error-message">{{WarningText}}</p>
			</div>
			<div class="small-container">
				<a href="javascript:location.reload()" class="second-button">

						<svg width="11" height="14" viewBox="0 0 11 14" fill="none" xmlns="http://www.w3.org/2000/svg">

					</div>
					<div>Reload</div>
				</a>
				{{SkipButton}}
			</div>
		</div>
	</div>
</body>

</html>
