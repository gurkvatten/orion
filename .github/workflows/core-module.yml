---
name: Core Module

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-latest
          preset: linux
        - runner: windows-2025-vs2026
          preset: windows

    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: app/src/core_module

    steps:
    - name: Skip WebKit submodule
      working-directory: .
      run: git config --global submodule.third_party/WebKit.update none

    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build zip libglib2.0-dev

    - name: Bootstrap vcpkg (Linux)
      if: runner.os == 'Linux'
      run: ./third_party/vcpkg/bootstrap-vcpkg.sh

    - name: Bootstrap vcpkg (Windows)
      if: runner.os == 'Windows'
      run: .\third_party\vcpkg\bootstrap-vcpkg.bat
      shell: cmd

    - name: Configure
      run: cmake --preset ${{ matrix.preset }}

    - name: Build (Debug)
      run: cmake --build --preset ${{ matrix.preset }}-debug

    - name: Build (Release)
      run: cmake --build --preset ${{ matrix.preset }}-release
